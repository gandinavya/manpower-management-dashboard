<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manpower Management Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <div class="logo">Mayfair Security & Cleaning Solutions</div>
    <p>Manpower Provider for Hospitals & Shopping Malls</p>
</header>

<div class="container">
    <section class="card">
        <h2>Client Requirement Form</h2>
        <form id="requirementForm">
            <label for="clientName">Organization Name</label>
            <input type="text" id="clientName" placeholder="e.g. City Care Hospital" required>

            <label for="facilityType">Facility Type</label>
            <select id="facilityType">
                <option value="Hospital">Hospital</option>
                <option value="Shopping Mall">Shopping Mall</option>
            </select>

            <label for="serviceType">Service Required</label>
            <select id="serviceType">
                <option value="Security Personnel">Security Personnel</option>
                <option value="Housecleaning / Housekeeping">Housecleaning / Housekeeping</option>
                <option value="Both (Security & Housecleaning)">Both (Security & Housecleaning)</option>
            </select>

            <label for="staffCount">Number of Staff Needed</label>
            <input type="number" id="staffCount" min="1" placeholder="e.g. 10" required>

            <label for="durationDays">Contract Duration (in Days)</label>
            <input type="number" id="durationDays" min="1" placeholder="e.g. 30" required>

            <button type="submit">Submit Requirement</button>
        </form>
        <div id="statusMsg"></div>
    </section>

    <section class="card">
        <h2>Active Deployments & Daily Task Logs</h2>
        <div id="deploymentsList">
            <p>Loading active contracts...</p>
        </div>
    </section>
</div>

<script src="app.js"></script>

</body>
</html>
</div>    
</body>
</html>
